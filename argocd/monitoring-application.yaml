apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.7.0
    helm:
      releaseName: monitoring
      valueFiles:
      - $values/monitoring/values.yaml
  - repoURL: https://github.com/mrattdevops/gitops-advanced-deployment.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/mrattdevops/gitops-advanced-deployment.git
    targetRevision: main
    path: monitoring/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Deliberately manual while migrating the existing Helm-managed release.
  # Do not enable automated sync or prune until ownership is verified.
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
